<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Shalmala - an app to practise musical instruments" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <title>Shalmala</title>
    <script defer src="app.js"></script>
</head>
<body>
    <div class="app">
        <header>
            <div class="header-bar">
                <div class="title">
                    <h1>Shalmala</h1>
                    <i>practise makes perfect!</i>
                </div>
                <div class="mode-picker">
                    <small>Pick a mode</small>
                    <div class="switch-body" id="mode-switch"></div>
                </div>
            </div>
        </header>
        <article>
            <div class="player-holder" id="mode-view"></div>
        </article>
        <footer>Made with ❤️ by Madhusoodan</footer>
    </div>
</body>
</html>
